<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хочешь сайт лучше этого? — alsat.asia</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Georgia', serif; overflow: hidden; }

.aquarium {
  position: relative;
  width: 820px;
  height: 520px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 0 6px #1a3a5c, 0 0 0 10px #0d2035, 0 30px 80px rgba(0,0,0,0.8), inset 0 0 120px rgba(0,100,200,0.1);
  cursor: crosshair;
}

@media (max-width: 860px) {
  .aquarium { width: 100vw; height: 60vw; border-radius: 0; }
}

canvas#water { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

.glass-left {
  position: absolute; top: 0; left: 0; width: 60px; height: 100%;
  background: linear-gradient(90deg, rgba(255,255,255,0.07) 0%, transparent 100%);
  pointer-events: none; z-index: 10;
}
.glass-top {
  position: absolute; top: 0; left: 0; right: 0; height: 40px;
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
  pointer-events: none; z-index: 10;
}

.fish {
  position: absolute;
  cursor: pointer;
  z-index: 5;
  transition: transform 0.1s;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
}
.fish:hover { transform: scale(1.2) !important; filter: drop-shadow(0 0 12px rgba(255,200,0,0.8)); }
.fish svg { display: block; }

.stone {
  position: absolute;
  bottom: 58px;
  cursor: pointer;
  z-index: 4;
  transition: transform 0.15s, filter 0.15s;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
}
.stone:hover { transform: translateY(-6px) scale(1.08) !important; filter: drop-shadow(0 0 14px rgba(100,200,255,0.7)); }

.weed {
  position: absolute;
  bottom: 70px;
  z-index: 3;
  transform-origin: bottom center;
  animation: sway 3s ease-in-out infinite;
  pointer-events: none;
}
@keyframes sway {
  0%,100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}

.bubble {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.3);
  background: rgba(255,255,255,0.05);
  pointer-events: none;
  animation: rise linear infinite;
  z-index: 6;
}
@keyframes rise {
  0%   { transform: translateY(0) translateX(0); opacity: 0.8; }
  100% { transform: translateY(-520px) translateX(var(--drift)); opacity: 0; }
}

.sand {
  position: absolute; bottom: 0; left: 0; right: 0; height: 75px;
  background: linear-gradient(180deg, #8b6914 0%, #a07820 30%, #c49a2a 70%, #b8891e 100%);
  border-radius: 0 0 18px 18px;
  z-index: 3;
}
.sand::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 18px;
  background: radial-gradient(ellipse 20px 10px at 10% 50%, rgba(0,0,0,0.15) 0%, transparent 70%),
              radial-gradient(ellipse 30px 8px at 30% 60%, rgba(0,0,0,0.1) 0%, transparent 70%),
              radial-gradient(ellipse 15px 6px at 60% 40%, rgba(0,0,0,0.12) 0%, transparent 70%),
              radial-gradient(ellipse 25px 9px at 80% 55%, rgba(0,0,0,0.1) 0%, transparent 70%);
}

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,30,0.8);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { opacity: 1; pointer-events: all; }
.modal {
  background: linear-gradient(135deg, #0d2a4a 0%, #0a1a30 60%, #071525 100%);
  border: 1px solid rgba(100,180,255,0.3);
  border-radius: 20px;
  padding: 50px 60px;
  text-align: center;
  max-width: 480px;
  box-shadow: 0 0 60px rgba(0,100,255,0.2), 0 30px 60px rgba(0,0,0,0.6);
  transform: scale(0.8);
  transition: transform 0.3s;
}
.modal-overlay.show .modal { transform: scale(1); }
.modal-emoji { font-size: 64px; margin-bottom: 20px; display: block; }
.modal h2 { color: #fff; font-size: 26px; margin-bottom: 12px; line-height: 1.3; }
.modal h2 span { color: #4db8ff; }
.modal p { color: rgba(200,220,255,0.75); font-size: 15px; margin-bottom: 30px; line-height: 1.6; }
.modal-btn {
  background: linear-gradient(135deg, #0080ff, #00c3ff);
  color: #fff;
  border: none;
  padding: 14px 36px;
  border-radius: 50px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  display: block;
  width: 100%;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 4px 20px rgba(0,128,255,0.4);
}
.modal-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,180,255,0.5); }
.modal-close {
  background: transparent; color: rgba(150,170,200,0.7);
  border: none; font-size: 13px; cursor: pointer; padding: 6px;
}
.modal-close:hover { color: #fff; }
.fish-name { color: #4db8ff; font-style: italic; font-size: 13px; margin-bottom: 20px; }

.aquarium-title {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  z-index: 9;
  color: rgba(255,255,255,0.15);
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  pointer-events: none;
  white-space: nowrap;
}

/* Hint text */
.hint {
  position: absolute; bottom: 82px; left: 50%; transform: translateX(-50%);
  z-index: 9;
  color: rgba(255,255,255,0.25);
  font-size: 11px;
  letter-spacing: 2px;
  pointer-events: none;
  white-space: nowrap;
  animation: fadeHint 4s ease-out forwards;
}
@keyframes fadeHint {
  0% { opacity: 1; }
  60% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>

<div class="aquarium" id="aquarium">
  <canvas id="water"></canvas>
  <div class="glass-left"></div>
  <div class="glass-top"></div>
  <div class="aquarium-title">🐟 Кликни на рыбку или камушек 🪨</div>
  <div class="hint">Нажми на любой объект →</div>

  <!-- Sand -->
  <div class="sand"></div>

  <!-- Seaweeds -->
  <div class="weed" style="left:60px; animation-duration:2.8s; animation-delay:0s;">
    <svg width="22" height="120" viewBox="0 0 22 120"><path d="M11 120 Q18 95 8 75 Q2 55 14 35 Q20 15 11 0" fill="none" stroke="#1a7a3a" stroke-width="4" stroke-linecap="round"/><path d="M11 100 Q22 85 18 68" fill="none" stroke="#228b44" stroke-width="3"/><path d="M11 70 Q0 58 4 44" fill="none" stroke="#1e7a3c" stroke-width="3"/></svg>
  </div>
  <div class="weed" style="left:68px; animation-duration:3.5s; animation-delay:0.5s;">
    <svg width="18" height="90" viewBox="0 0 18 90"><path d="M9 90 Q15 70 6 52 Q0 35 11 18 Q16 6 9 0" fill="none" stroke="#2a9a4a" stroke-width="3.5" stroke-linecap="round"/></svg>
  </div>
  <div class="weed" style="left:650px; animation-duration:3.2s; animation-delay:1s;">
    <svg width="22" height="110" viewBox="0 0 22 110"><path d="M11 110 Q18 88 7 68 Q1 48 13 28 Q19 10 11 0" fill="none" stroke="#1a7a3a" stroke-width="4" stroke-linecap="round"/><path d="M11 90 Q22 76 18 60" fill="none" stroke="#228b44" stroke-width="3"/></svg>
  </div>
  <div class="weed" style="left:700px; animation-duration:2.6s; animation-delay:0.3s;">
    <svg width="16" height="80" viewBox="0 0 16 80"><path d="M8 80 Q14 60 5 44 Q-1 28 10 12 Q14 4 8 0" fill="none" stroke="#2a9a4a" stroke-width="3" stroke-linecap="round"/></svg>
  </div>
  <div class="weed" style="left:360px; animation-duration:4s; animation-delay:1.5s;">
    <svg width="20" height="100" viewBox="0 0 20 100"><path d="M10 100 Q17 78 7 60 Q0 42 12 22 Q18 8 10 0" fill="none" stroke="#1d8040" stroke-width="3.5" stroke-linecap="round"/></svg>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <span class="modal-emoji" id="modal-emoji">🐠</span>
    <div class="fish-name" id="modal-fish">Золотая рыбка говорит:</div>
    <h2>Хочешь сайт <span>лучше этого?</span></h2>
    <p>Аквариум — красиво. Но твой бизнес заслуживает сайта, который работает на тебя 24/7. Современный дизайн, быстрая загрузка, AI-чат-боты и автоматизация.</p>
    <button class="modal-btn" onclick="window.open('https://alsat.asia','_blank')">🚀 Обсудить проект на alsat.asia</button>
    <button class="modal-close" onclick="closeModal()">Нет, я доволен обычным сайтом</button>
  </div>
</div>

<script>
const aquarium = document.getElementById('aquarium');
const W = 820, H = 520;

// Water & caustics
const canvas = document.getElementById('water');
canvas.width = W; canvas.height = H;
const ctx = canvas.getContext('2d');

function drawWater(t) {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0,   '#0a2a5a');
  grad.addColorStop(0.3, '#0d3a7a');
  grad.addColorStop(0.7, '#0a2855');
  grad.addColorStop(1,   '#050e20');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  for (let i = 0; i < 14; i++) {
    const x = (i / 14) * W + Math.sin(t * 0.4 + i) * 30;
    const w = 8 + Math.sin(t * 0.6 + i * 1.3) * 5;
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    g.addColorStop(0, `rgba(100,180,255,${0.04 + Math.sin(t*0.5+i)*0.02})`);
    g.addColorStop(1, 'rgba(100,180,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - w, 0); ctx.lineTo(x + w, 0);
    ctx.lineTo(x + w * 2, H * 0.7); ctx.lineTo(x - w * 2, H * 0.7);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  ctx.save();
  for (let i = 0; i < 6; i++) {
    const y = 4 + Math.sin(t * 1.2 + i * 1.1) * 3;
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(150,210,255,0)');
    g.addColorStop(0.3 + Math.sin(t+i)*0.1, `rgba(180,230,255,0.08)`);
    g.addColorStop(1, 'rgba(150,210,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, y + i*4, W, 2);
  }
  ctx.restore();
}

// Bubbles
function makeBubble() {
  const b = document.createElement('div');
  b.className = 'bubble';
  const size = 3 + Math.random() * 8;
  b.style.cssText = `width:${size}px;height:${size}px;left:${20+Math.random()*(W-40)}px;bottom:${70+Math.random()*50}px;--drift:${(Math.random()-0.5)*40}px;animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*6}s;`;
  aquarium.appendChild(b);
  setTimeout(() => b.remove(), 12000);
}
setInterval(makeBubble, 700);
for(let i=0;i<8;i++) makeBubble();

// Fish
const FISH_DATA = [
  { name:'Золотая рыбка',    emoji:'🐠', color1:'#ff9900', color2:'#ffcc44', fin:'#ff6600', scale:'#ffaa22', size:1.0,  y:130, speed:1.2 },
  { name:'Синяя рыбка',      emoji:'🐟', color1:'#1166dd', color2:'#44aaff', fin:'#0044cc', scale:'#2288ff', size:0.85, y:220, speed:0.9 },
  { name:'Тропическая рыба', emoji:'🐡', color1:'#ff4488', color2:'#ff88bb', fin:'#cc2266', scale:'#ff66aa', size:1.1,  y:170, speed:0.7 },
  { name:'Изумрудная рыбка', emoji:'🦈', color1:'#22aa66', color2:'#44dd88', fin:'#118844', scale:'#33cc77', size:0.9,  y:300, speed:1.4 },
  { name:'Фиолетовая рыба',  emoji:'🐠', color1:'#8833dd', color2:'#bb66ff', fin:'#6622bb', scale:'#9944ee', size:0.95, y:260, speed:0.8 },
  { name:'Белая рыба',       emoji:'🐟', color1:'#aaccff', color2:'#ddeeff', fin:'#88aadd', scale:'#bbddff', size:0.75, y:180, speed:1.5 },
];

function fishSVG(d, flip) {
  const s = d.size * 70, sh = d.size * 40;
  return `<svg width="${s}" height="${sh}" viewBox="0 0 70 40" style="transform:scaleX(${flip?-1:1})">
    <polygon points="62,10 70,2 70,38 62,30 66,20" fill="${d.fin}" opacity="0.9"/>
    <ellipse cx="32" cy="20" rx="32" ry="16" fill="${d.color1}"/>
    <ellipse cx="28" cy="24" rx="22" ry="10" fill="${d.color2}" opacity="0.6"/>
    <ellipse cx="22" cy="16" rx="9" ry="6" fill="${d.scale}" opacity="0.3"/>
    <ellipse cx="34" cy="14" rx="8" ry="5" fill="${d.scale}" opacity="0.25"/>
    <path d="M20,4 Q30,-6 44,4" fill="${d.fin}" opacity="0.85"/>
    <circle cx="10" cy="17" r="5" fill="white"/>
    <circle cx="9" cy="17" r="3" fill="#111"/>
    <circle cx="8" cy="16" r="1" fill="white"/>
    <path d="M2,20 Q5,22 4,24" fill="none" stroke="${d.fin}" stroke-width="1.2" stroke-linecap="round"/>
  </svg>`;
}

const fishEls = FISH_DATA.map((d, i) => {
  const el = document.createElement('div');
  el.className = 'fish';
  el.innerHTML = fishSVG(d, false);
  el.style.top = d.y + 'px';
  el.title = d.name;
  el.onclick = () => openModal(d.emoji, d.name);
  aquarium.appendChild(el);
  return { el, d, flip: false, t: Math.random() * 100 };
});

// Stones
const STONES = [
  { x:90,  w:60, h:38, rx:28, ry:18, c1:'#5a5a6a', c2:'#7a7a8a', label:'🪨', name:'Серый валун' },
  { x:200, w:44, h:28, rx:20, ry:13, c1:'#6a5a4a', c2:'#8a7a6a', label:'🪨', name:'Коричневый камень' },
  { x:310, w:75, h:44, rx:36, ry:20, c1:'#4a6a5a', c2:'#6a8a7a', label:'🗿', name:'Мшистый булыжник' },
  { x:430, w:50, h:32, rx:24, ry:15, c1:'#5a6a7a', c2:'#7a8a9a', label:'🪨', name:'Голубой сланец' },
  { x:550, w:66, h:40, rx:30, ry:18, c1:'#7a6a5a', c2:'#9a8a7a', label:'🪨', name:'Песчаник' },
  { x:670, w:42, h:26, rx:20, ry:12, c1:'#6a5a6a', c2:'#8a7a8a', label:'💎', name:'Кристалл' },
  { x:750, w:55, h:35, rx:26, ry:16, c1:'#4a5a6a', c2:'#6a7a8a', label:'🪨', name:'Базальт' },
];

STONES.forEach(s => {
  const el = document.createElement('div');
  el.className = 'stone';
  el.style.left = s.x + 'px';
  el.innerHTML = `<svg width="${s.w}" height="${s.h}" viewBox="0 0 ${s.w} ${s.h}">
    <defs><radialGradient id="sg${s.x}" cx="40%" cy="35%">
      <stop offset="0%" stop-color="${s.c2}"/>
      <stop offset="100%" stop-color="${s.c1}"/>
    </radialGradient></defs>
    <ellipse cx="${s.w/2}" cy="${s.h/2+2}" rx="${s.rx}" ry="${s.ry}" fill="rgba(0,0,0,0.3)"/>
    <ellipse cx="${s.w/2}" cy="${s.h/2}" rx="${s.rx}" ry="${s.ry}" fill="url(#sg${s.x})"/>
    <ellipse cx="${s.w/2-s.rx*0.2}" cy="${s.h/2-s.ry*0.2}" rx="${s.rx*0.5}" ry="${s.ry*0.4}" fill="rgba(255,255,255,0.08)"/>
  </svg>`;
  el.title = s.name;
  el.onclick = () => openModal(s.label, s.name);
  aquarium.appendChild(el);
});

// Modal
function openModal(emoji, name) {
  document.getElementById('modal-emoji').textContent = emoji;
  document.getElementById('modal-fish').textContent = name + ' говорит:';
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Animation
let t = 0;
function animate() {
  t += 0.016;
  drawWater(t);
  fishEls.forEach((f, i) => {
    f.t += f.d.speed * 0.012;
    const yOffset = Math.sin(f.t * 0.7 + i) * 30;
    const xRange = W - 140;
    const xPos = ((f.t * 80 * f.d.speed) % (xRange * 2));
    const x = xPos > xRange ? (xRange * 2 - xPos) : xPos;
    const goRight = xPos <= xRange;
    if (goRight !== !f.flip) {
      f.flip = !goRight;
      f.el.innerHTML = fishSVG(f.d, f.flip);
    }
    f.el.style.left = (x + 40) + 'px';
    f.el.style.top  = (f.d.y + yOffset) + 'px';
  });
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>

  <style>
    :root{--accent:#79e4d3;--ink:#111;--paper:#f4f1ea;--muted:#6f716e}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden}a{color:inherit}.demo-dock{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(10,12,14,.76);color:white;backdrop-filter:blur(15px);box-shadow:0 10px 36px rgba(0,0,0,.22);font:600 10px DM Sans,sans-serif}.demo-dock a{text-decoration:none;background:white;color:#111;padding:7px 10px;border-radius:999px}.demo-dock i{width:7px;height:7px;border-radius:50%;background:#7ce7c7;box-shadow:0 0 10px #7ce7c7}.enter{animation:enter .8s cubic-bezier(.2,.8,.2,1) both}@keyframes enter{from{opacity:0;transform:translateY(18px)}}img{display:block;max-width:100%;object-fit:cover}.cta{display:inline-flex;align-items:center;gap:10px;padding:14px 19px;text-decoration:none;font-weight:700;font-size:13px}.arrow:after{content:'↗';font-size:18px}.label{text-transform:uppercase;letter-spacing:.18em;font:600 10px DM Sans,sans-serif}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

    /* 01 — fashion: asymmetrical editorial magazine */
    .fashion{--paper:#f0e9df;--ink:#211916;font-family:DM Sans}.fashion .page{min-height:100vh;display:grid;grid-template-columns:92px 1.15fr .85fr}.fashion .rail{border-right:1px solid #b9aea4;display:flex;align-items:center;justify-content:center}.fashion .rail span{writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.28em;font-size:10px}.fashion .copy{padding:8vh 5vw;display:flex;flex-direction:column}.fashion nav{display:flex;gap:30px;font-size:11px}.fashion nav b{margin-right:auto;font-size:18px}.fashion h1{font:italic 500 clamp(70px,10vw,155px)/.72 'Cormorant Garamond';letter-spacing:-.055em;margin:auto 0 25px}.fashion h1 em{display:block;margin-left:12vw;color:var(--accent);font-style:normal}.fashion p{max-width:470px;line-height:1.65;color:#6b5c54}.fashion .cta{align-self:flex-start;margin-top:24px;border-bottom:1px solid}.fashion .visual{position:relative;margin:18px 18px 18px 0;overflow:hidden}.fashion .visual img{width:100%;height:100%}.fashion .issue{position:absolute;right:18px;top:18px;padding:10px;background:#f0e9df;font:500 10px IBM Plex Mono}.fashion .look{position:absolute;left:18px;bottom:18px;color:white;font:500 11px IBM Plex Mono}.fashion .look b{display:block;font:500 42px 'Cormorant Garamond'}

    /* 02 — beauty: soft radial sanctuary */
    .beauty{--paper:#eadfdc;--ink:#422d2c;font-family:'Cormorant Garamond'}.beauty .page{min-height:100vh;position:relative;display:grid;place-items:center;padding:110px 6vw 70px;overflow:hidden}.beauty .halo{position:absolute;width:min(74vw,870px);aspect-ratio:1;border:1px solid rgba(104,70,68,.25);border-radius:50%;animation:float 8s ease-in-out infinite}.beauty .halo:before,.beauty .halo:after{content:'';position:absolute;inset:7%;border:1px solid rgba(104,70,68,.14);border-radius:50%}.beauty .halo:after{inset:18%}.beauty .portrait{position:absolute;width:min(34vw,420px);aspect-ratio:.78;left:9vw;top:14vh;border-radius:48% 48% 18px 18px;overflow:hidden;transform:rotate(-4deg)}.beauty .portrait img{width:100%;height:100%}.beauty .copy{position:relative;z-index:2;max-width:680px;margin-left:25vw;text-align:center}.beauty .label{font-family:DM Sans;color:#8e615b}.beauty h1{font-size:clamp(66px,10vw,142px);font-weight:500;line-height:.78;letter-spacing:-.05em;margin:25px 0}.beauty h1 span{display:block;font-style:italic;color:#a56c64}.beauty p{font:400 18px/1.6 Manrope;max-width:530px;margin:0 auto 30px;color:#735c59}.beauty .cta{border:1px solid #6b4a47;border-radius:999px}.beauty .petals{position:absolute;right:6vw;bottom:8vh;display:grid;gap:8px;font:500 11px DM Sans}.beauty .petals span{padding:12px 18px;background:rgba(255,255,255,.38);border-radius:999px}@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}

    /* 03 — dental: clinical modular interface */
    .dental{--paper:#eef8f8;--ink:#12373e;font-family:'Space Grotesk'}.dental .page{min-height:100vh;padding:24px;display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.dental .left,.dental .right>div{border:1px solid #b8d4d6;border-radius:28px;background:rgba(255,255,255,.72)}.dental .left{padding:clamp(28px,5vw,72px);display:flex;flex-direction:column}.dental nav{display:flex;align-items:center;gap:26px;font-size:12px}.dental nav b{font-size:20px;margin-right:auto}.dental .cross{color:#0a9ea8}.dental h1{font-size:clamp(58px,8vw,118px);line-height:.85;letter-spacing:-.075em;margin:auto 0 28px}.dental p{max-width:600px;color:#58757a;line-height:1.55}.dental .cta{align-self:flex-start;margin-top:26px;border-radius:14px;background:#12373e;color:white}.dental .right{display:grid;grid-template-rows:1.35fr .65fr;gap:16px}.dental .photo{overflow:hidden;position:relative}.dental .photo img{width:100%;height:100%}.dental .photo span{position:absolute;right:18px;bottom:18px;background:white;padding:10px 13px;border-radius:12px;font-size:11px}.dental .metrics{display:grid!important;grid-template-columns:repeat(3,1fr);padding:24px}.dental .metric{padding:12px;border-right:1px solid #bdd7d9}.dental .metric:last-child{border:0}.dental .metric b{display:block;font-size:28px}.dental .metric small{color:#6e8a8e}

    /* 04 — restaurant: cinematic menu poster */
    .restaurant{--paper:#120f0c;--ink:#f5e7d2;font-family:DM Sans}.restaurant .page{min-height:100vh;position:relative;display:grid;grid-template-columns:.9fr 1.1fr;background:#120f0c}.restaurant .image{height:100vh;position:sticky;top:0}.restaurant .image img{width:100%;height:100%;filter:saturate(.8) contrast(1.08)}.restaurant .image:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#120f0c)}.restaurant .copy{padding:7vh 6vw;display:flex;flex-direction:column}.restaurant nav{display:flex;justify-content:space-between;color:#c99f70;font-size:10px;letter-spacing:.18em;text-transform:uppercase}.restaurant h1{font:400 clamp(78px,11vw,170px)/.72 'Bebas Neue';letter-spacing:-.02em;margin:14vh 0 22px}.restaurant h1 span{color:#d1482f}.restaurant p{max-width:520px;color:#bcae9d;line-height:1.65}.restaurant .menu{margin-top:auto;border-top:1px solid #493d31}.restaurant .dish{display:flex;padding:17px 0;border-bottom:1px solid #493d31;font-family:'Cormorant Garamond';font-size:21px}.restaurant .dish span:last-child{margin-left:auto;color:#d7a66b}.restaurant .cta{align-self:flex-start;margin-top:28px;background:#d1482f;color:white}

    /* 05 — construction: digital blueprint */
    .construction{--paper:#e8e4da;--ink:#131516;font-family:'IBM Plex Mono'}.construction .page{min-height:100vh;position:relative;padding:30px;background-image:linear-gradient(#c9c6bc 1px,transparent 1px),linear-gradient(90deg,#c9c6bc 1px,transparent 1px);background-size:42px 42px}.construction .frame{min-height:calc(100vh - 60px);border:2px solid #1d2021;display:grid;grid-template-columns:1fr 1fr}.construction .copy{padding:5vw;display:flex;flex-direction:column}.construction .top{display:flex;font-size:10px}.construction .top span:last-child{margin-left:auto}.construction h1{font:600 clamp(50px,7.8vw,120px)/.86 'Unbounded';letter-spacing:-.065em;text-transform:uppercase;margin:auto 0 24px}.construction h1 span{color:#f05b37}.construction p{max-width:590px;line-height:1.65;font-size:13px}.construction .cta{align-self:flex-start;margin-top:24px;border:2px solid;background:#e8e4da}.construction .model{margin:18px;position:relative;overflow:hidden;background:#1b1e1f}.construction .model img{width:100%;height:100%;opacity:.82;filter:grayscale(1)}.construction .model:before,.construction .model:after{content:'';position:absolute;z-index:2;background:#f05b37}.construction .model:before{width:2px;height:90%;left:18%;top:5%}.construction .model:after{height:2px;width:90%;left:5%;top:32%}.construction .measure{position:absolute;z-index:3;color:white;font-size:10px}.construction .m1{left:20%;top:8%}.construction .m2{right:8%;top:34%}.construction .index{position:absolute;right:20px;bottom:16px;color:#f05b37;font-size:70px;font-weight:700}

    /* 06 — realty: horizontal property deck */
    .realty{--paper:#e5e1d8;--ink:#252721;font-family:Manrope}.realty .page{min-height:100vh;padding:32px 4vw}.realty nav{display:flex;align-items:center;border-bottom:1px solid #999b92;padding-bottom:20px;font-size:12px}.realty nav b{margin-right:auto;font:600 20px Fraunces}.realty nav a{margin-left:25px;text-decoration:none}.realty .intro{display:grid;grid-template-columns:1.25fr .75fr;gap:50px;align-items:end;padding:8vh 0 5vh}.realty h1{font:500 clamp(65px,9vw,140px)/.78 Fraunces;letter-spacing:-.06em;margin:0}.realty .intro p{line-height:1.6;color:#696c63}.realty .deck{display:grid;grid-template-columns:1.35fr .75fr .75fr;gap:14px;height:48vh;min-height:400px}.realty .property{position:relative;overflow:hidden;border-radius:4px}.realty .property img{width:100%;height:100%}.realty .property:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 48%,rgba(0,0,0,.72))}.realty .property div{position:absolute;z-index:2;left:18px;right:18px;bottom:17px;color:white}.realty .property b{display:block;font:500 25px Fraunces}.realty .property small{opacity:.72}.realty .cta{position:absolute;right:16px;top:16px;z-index:3;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;background:white;color:#111;padding:0}

    /* 07 — hotel: immersive postcard */
    .hotel{--paper:#18221d;--ink:white;font-family:Manrope}.hotel .page{min-height:100vh;position:relative;background:#18221d}.hotel .backdrop{position:absolute;inset:0}.hotel .backdrop img{width:100%;height:100%;filter:saturate(.78)}.hotel .backdrop:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,20,13,.8),transparent 65%),linear-gradient(0deg,rgba(9,20,13,.65),transparent 45%)}.hotel nav{position:relative;z-index:2;display:flex;padding:28px 4vw;align-items:center;font-size:11px}.hotel nav b{font:600 21px Fraunces;margin-right:auto}.hotel nav span{margin-left:28px}.hotel .copy{position:absolute;z-index:2;left:5vw;bottom:8vh;max-width:740px}.hotel .copy .label{color:#d8dfbd}.hotel h1{font:500 clamp(68px,10vw,150px)/.78 Fraunces;letter-spacing:-.06em;margin:18px 0}.hotel p{max-width:540px;line-height:1.65;color:#d4dbd5}.hotel .booking{position:absolute;z-index:3;right:4vw;bottom:5vh;width:min(350px,40vw);padding:22px;border-radius:20px;background:rgba(244,241,229,.92);color:#24332a;backdrop-filter:blur(15px)}.hotel .booking b{font:600 24px Fraunces}.hotel .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0}.hotel .dates span{padding:12px;border:1px solid #b9c3b8;border-radius:10px;font-size:11px}.hotel .cta{width:100%;justify-content:center;border-radius:11px;background:#263c2e;color:white}

    /* 08 — fitness: kinetic brutalism */
    .fitness{--paper:#d9ff32;--ink:#0b0b0b;font-family:'Space Grotesk'}.fitness .page{min-height:100vh;position:relative;overflow:hidden;background:#d9ff32}.fitness .stripe{position:absolute;inset:-15% 38% -15% 42%;background:#111;transform:rotate(13deg)}.fitness nav{position:relative;z-index:3;padding:25px 3vw;display:flex;font-weight:700;text-transform:uppercase}.fitness nav span{margin-left:auto}.fitness .copy{position:relative;z-index:2;padding:7vh 4vw;width:74%}.fitness h1{font:700 clamp(84px,15vw,220px)/.67 'Bebas Neue';text-transform:uppercase;margin:8vh 0 18px;letter-spacing:-.025em}.fitness h1 span{display:block;margin-left:15vw;color:white;-webkit-text-stroke:2px #111;text-shadow:6px 6px #111}.fitness p{max-width:430px;font-weight:600;line-height:1.55}.fitness .cta{background:#111;color:white;box-shadow:7px 7px white;margin-top:18px}.fitness .photo{position:absolute;right:3vw;top:13vh;width:39vw;height:72vh;z-index:1;clip-path:polygon(20% 0,100% 0,80% 100%,0 100%)}.fitness .photo img{width:100%;height:100%;filter:grayscale(1);mix-blend-mode:luminosity}.fitness .ticker{position:absolute;z-index:5;bottom:0;width:100%;white-space:nowrap;overflow:hidden;background:white;border-block:2px solid;padding:12px;font-weight:700;text-transform:uppercase}.fitness .ticker span{display:inline-block;animation:scroll 18s linear infinite}@keyframes scroll{to{transform:translateX(-50%)}}

    /* 09 — education: playful bento */
    .education{--paper:#f7f3ff;--ink:#241d3a;font-family:'Space Grotesk'}.education .page{min-height:100vh;padding:22px;background:#f7f3ff}.education nav{height:66px;display:flex;align-items:center;padding:0 18px}.education nav b{font-size:22px;margin-right:auto}.education nav .cta{padding:10px 15px;border-radius:12px;background:#6a4df5;color:white}.education .bento{display:grid;grid-template-columns:1.4fr .7fr .7fr;grid-template-rows:1.2fr .8fr;gap:14px;min-height:calc(100vh - 110px)}.education .tile{border-radius:30px;padding:30px;overflow:hidden;position:relative}.education .main{grid-row:span 2;background:#6a4df5;color:white}.education h1{font-size:clamp(54px,7.5vw,112px);line-height:.83;letter-spacing:-.07em;margin:7vh 0 25px}.education .main p{max-width:520px;color:#d9d2ff;line-height:1.55}.education .bubble{display:inline-block;margin-top:25px;background:#d9ff56;color:#191324;border-radius:999px;padding:14px 18px;font-weight:700}.education .photo{grid-column:span 2;padding:0}.education .photo img{width:100%;height:100%}.education .stat{background:#ffd26a}.education .stat b{display:block;font-size:60px;letter-spacing:-.06em}.education .idea{background:#bdebed}.education .idea:after{content:'✦';position:absolute;right:24px;bottom:10px;font-size:90px;color:#68b8bd}

    /* 10 — logistics: route control room */
    .logistics{--paper:#06141f;--ink:#e8f6ff;font-family:'IBM Plex Mono'}.logistics .page{min-height:100vh;display:grid;grid-template-columns:360px 1fr;background:#06141f}.logistics aside{padding:32px;border-right:1px solid #1e3b4e;display:flex;flex-direction:column}.logistics aside b{font:600 22px 'Space Grotesk'}.logistics h1{font:600 clamp(45px,5vw,78px)/.9 'Space Grotesk';letter-spacing:-.06em;margin:auto 0 24px}.logistics aside p{color:#7895a7;line-height:1.65;font-size:12px}.logistics .cta{align-self:flex-start;margin-top:22px;background:#39c7ed;color:#02111a}.logistics .map{position:relative;overflow:hidden;background-image:linear-gradient(rgba(55,123,154,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(55,123,154,.12) 1px,transparent 1px);background-size:48px 48px}.logistics .map:before{content:'';position:absolute;width:65%;height:42%;left:12%;top:23%;border:2px dashed #35c9ef;border-radius:48% 52% 42% 58%;transform:rotate(-13deg);filter:drop-shadow(0 0 7px #35c9ef)}.logistics .node{position:absolute;width:18px;height:18px;border:4px solid #06141f;border-radius:50%;background:#ffb454;box-shadow:0 0 0 1px #ffb454,0 0 18px #ffb454}.logistics .n1{left:18%;top:29%}.logistics .n2{left:52%;top:55%}.logistics .n3{right:18%;top:30%}.logistics .shipment{position:absolute;right:5%;bottom:7%;width:310px;padding:20px;border:1px solid #28536b;background:rgba(7,29,43,.88);backdrop-filter:blur(10px)}.logistics .shipment small{color:#5e8498}.logistics .shipment b{display:block;margin:8px 0 18px;font:600 22px 'Space Grotesk'}.logistics .progress{height:4px;background:#19384b}.logistics .progress i{display:block;width:72%;height:100%;background:#39c7ed}

    /* 11 — autoservice: racing service board */
    .autoservice{--paper:#181818;--ink:#f4f2e9;font-family:'Space Grotesk'}.autoservice .page{min-height:100vh;background:#181818;position:relative;padding:28px 4vw}.autoservice .redline{position:absolute;left:0;right:0;top:0;height:7px;background:#ef443b}.autoservice nav{display:flex;align-items:center;border-bottom:1px solid #383838;padding:10px 0 25px;text-transform:uppercase;font-size:11px}.autoservice nav b{font:400 29px 'Bebas Neue';margin-right:auto;letter-spacing:.08em}.autoservice .hero{display:grid;grid-template-columns:1fr 1fr;min-height:68vh;align-items:center}.autoservice h1{font:400 clamp(78px,11vw,160px)/.72 'Bebas Neue';text-transform:uppercase;margin:0}.autoservice h1 span{color:#ef443b}.autoservice p{max-width:480px;color:#8f8f8b;line-height:1.55}.autoservice .cta{margin-top:20px;border:1px solid #ef443b;color:#ef443b}.autoservice .car{height:57vh;position:relative;overflow:hidden;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)}.autoservice .car img{width:100%;height:100%;filter:grayscale(1) contrast(1.25)}.autoservice .service-row{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #383838}.autoservice .service{padding:20px;border-right:1px solid #383838}.autoservice .service b{display:block;color:#ef443b;font-size:12px}.autoservice .service span{display:block;margin-top:8px;font-size:18px}

    /* 12 — agro: contemporary farm newspaper */
    .agro{--paper:#f1edda;--ink:#27301d;font-family:'DM Sans'}.agro .page{min-height:100vh;padding:24px 3vw}.agro .mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-block:2px solid;padding:11px 0;font:500 10px IBM Plex Mono;text-transform:uppercase}.agro .mast b{font:600 clamp(32px,4vw,58px) Fraunces;text-align:center}.agro .mast span:last-child{text-align:right}.agro .lead{display:grid;grid-template-columns:1.25fr .75fr;gap:25px;padding:25px 0;border-bottom:1px solid #6f755f}.agro h1{font:600 clamp(58px,8vw,120px)/.8 Fraunces;letter-spacing:-.055em;margin:0}.agro .lead-copy{display:flex;flex-direction:column;justify-content:end}.agro p{line-height:1.6;color:#626a54}.agro .cta{align-self:flex-start;border:1px solid;margin-top:18px}.agro .produce{display:grid;grid-template-columns:1.4fr repeat(3,.7fr);gap:12px;padding-top:16px}.agro .produce article{min-height:310px;border:1px solid #929783;padding:14px;display:flex;flex-direction:column}.agro .produce article:first-child{padding:0;overflow:hidden}.agro .produce img{width:100%;height:100%}.agro .produce b{margin-top:auto;font:600 24px Fraunces}.agro .produce small{font:500 10px IBM Plex Mono;color:#737963}

    /* 13 — legal: restrained monograph */
    .legal{--paper:#f5f2eb;--ink:#161616;font-family:'DM Sans'}.legal .page{min-height:100vh;display:grid;grid-template-columns:26% 74%}.legal aside{padding:35px;border-right:1px solid #aaa8a2;display:flex;flex-direction:column}.legal aside b{font:600 22px Fraunces}.legal aside .index{margin:auto 0;font:500 11px IBM Plex Mono;line-height:2.2}.legal aside small{color:#777}.legal main{padding:35px 5vw}.legal nav{display:flex;justify-content:flex-end;gap:28px;font-size:11px}.legal h1{font:500 clamp(64px,9vw,138px)/.78 Fraunces;letter-spacing:-.065em;margin:13vh 0 7vh}.legal h1 span{display:block;margin-left:13vw;font-style:italic;color:#766347}.legal .statement{display:grid;grid-template-columns:1fr 1fr;gap:40px;border-top:1px solid;padding-top:24px}.legal .statement p{margin:0;line-height:1.7;color:#5f5d59}.legal .matters{counter-reset:item}.legal .matter{counter-increment:item;display:flex;padding:14px 0;border-bottom:1px solid #ccc9c1}.legal .matter:before{content:'0' counter(item);margin-right:28px;font:500 10px IBM Plex Mono;color:#8b7554}.legal .cta{margin-top:28px;background:#171717;color:white}

    /* 14 — events: luminous collage */

<body>
  <div id="app"></div>
  <div class="demo-dock"><i></i><span>ALSAT FLAGSHIP</span><a href="./showrooms.html">Все флагманы</a></div>
  <script src="./showroom-presets.js"></script>
  <script>
    (()=>{
      const params=new URLSearchParams(location.search);
      const p=window.ALSAT_SHOWROOMS.find(item=>item.id===params.get('preset'))||window.ALSAT_SHOWROOMS[0];
      const raw=value=>String(value||'').replace(/[<>]/g,'').trim();
      const escape=value=>raw(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      const brand=escape((params.get('brand')||p.title).slice(0,40));
      const city=escape((params.get('city')||'Казахстан').slice(0,40));
      const title=escape(p.headline),copy=escape(p.copy),image=escape(p.image);
      const items=p.items.map(escape),features=p.features.map(escape);
      const contact=`https://wa.me/77064244277?text=${encodeURIComponent(`Здравствуйте! Хочу адаптировать демо «${raw(brand)}» (${p.id}) под мой бизнес.`)}`;
      const A=(text=p.cta)=>`<a class="cta arrow" href="${contact}" target="_blank" rel="noopener">${escape(text)}</a>`;
      const I=(cls='')=>`<img class="${cls}" src="${image}" alt="${brand} — демонстрационный образ">`;
      const Iu=(url,alt,cls='')=>`<img class="${cls}" src="${url}" alt="${escape(alt)}">`;
      const render={
        fashion:()=>`<div class="flagship-page"><header class="f-nav"><b class="f-logo">${brand}</b><a href="#collection">Коллекция</a><a href="#story">Ателье</a><a href="#journal">Журнал</a><a href="${contact}" target="_blank" rel="noopener">Записаться ↗</a></header><main><section class="f-hero"><div class="f-hero-copy enter"><span class="f-kicker">Capsule 01 · ${city}</span><h1>Wear your <span>story</span></h1><p>${copy} Каждая вещь создаётся небольшим тиражом и подбирается как часть цельного образа.</p>${A('Смотреть коллекцию')}</div><div class="f-stage enter">${Iu('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1500&q=88','Новая коллекция','main')}${Iu('https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=900&q=88','Детали образа','side')}<span class="caption">LOOK 01 / LIMITED EDITION</span></div></section><div class="f-ticker"><span>NEW SILHOUETTES ✦ PERSONAL FITTING ✦ LIMITED EDITION ✦ MADE IN KAZAKHSTAN ✦ NEW SILHOUETTES ✦ PERSONAL FITTING ✦ LIMITED EDITION ✦ MADE IN KAZAKHSTAN ✦ </span></div><section class="f-section" id="collection"><header class="f-head"><small>Selected pieces / 01—03</small><h2>Коллекция, собранная вокруг характера</h2></header><div class="f-products"><article class="f-product"><figure>${Iu('https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1000&q=88','Капсульные костюмы')}</figure><div><span>Костюмы</span><span>01</span></div></article><article class="f-product"><figure>${Iu('https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=1000&q=88','Вечерние платья')}</figure><div><span>Платья</span><span>02</span></div></article><article class="f-product"><figure>${Iu('https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1000&q=88','Готовые капсулы')}</figure><div><span>Капсулы</span><span>03</span></div></article></div></section><section class="f-story" id="story"><figure>${Iu('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=1400&q=88','Работа в ателье')}</figure><div class="f-story-copy"><span class="f-kicker">The atelier</span><h2>Посадка важнее размера</h2><p>Мы начинаем не с таблицы, а с разговора. Смотрим, как вы двигаетесь, где проводите день и какое впечатление хотите создавать. После примерки корректируем детали, пока вещь не станет вашей.</p>${A('Записаться на примерку')}</div></section><footer class="f-footer" id="journal"><h2>Let’s create your look.</h2><div class="f-footer-row"><span>${brand} · ${city}</span><span>Instagram · WhatsApp · Telegram</span></div></footer></main></div>`,
        beauty:()=>`<div class="page"><div class="halo"></div><figure class="portrait enter">${I()}</figure><section class="copy enter"><span class="label">${p.eyebrow}</span><h1>Красота <span>в вашем ритме</span></h1><p>${copy}</p>${A()}</section><aside class="petals">${items.map(x=>`<span>${x}</span>`).join('')}</aside></div>`,
        dental:()=>`<div class="page"><section class="left enter"><nav><b>${brand}<span class="cross"> +</span></b><span>Врачи</span><span>Услуги</span><span>${city}</span></nav><h1>${title}</h1><p>${copy}</p>${A()}</section><aside class="right enter"><div class="photo">${I()}<span>Спокойный первый визит</span></div><div class="metrics">${items.map((x,i)=>`<div class="metric"><b>0${i+1}</b><small>${x}</small></div>`).join('')}</div></aside></div>`,
        restaurant:()=>`<div class="page"><figure class="image">${I()}</figure><section class="copy enter"><nav><b>${brand}</b><span>${city} · kitchen</span></nav><h1>LOCAL<br><span>FLAME</span></h1><p>${copy}</p><div class="menu">${items.map((x,i)=>`<div class="dish"><span>${x}</span><span>0${i+1}</span></div>`).join('')}</div>${A('Забронировать')}</section></div>`,
        construction:()=>`<div class="page"><div class="frame"><section class="copy enter"><div class="top"><span>${brand} / ARCHITECTS</span><span>${city}</span></div><h1>Build<br><span>Beyond</span></h1><p>${copy}</p>${A('Смотреть проекты')}</section><figure class="model">${I()}<span class="measure m1">+12.400</span><span class="measure m2">38° / AXIS</span><b class="index">01</b></figure></div></div>`,
        realty:()=>`<div class="page"><nav><b>${brand}</b><a>Коллекция</a><a>Районы</a><a>Подбор</a></nav><header class="intro enter"><h1>${title}</h1><p>${copy}</p></header><section class="deck">${items.map((x,i)=>`<article class="property">${I()}<a class="cta arrow" href="${contact}"></a><div><small>${city} · COLLECTION 0${i+1}</small><b>${x}</b></div></article>`).join('')}</section></div>`,
        hotel:()=>`<div class="flagship-page"><section class="h-hero"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=2000&q=90" alt="Горная долина"><header class="h-nav"><b class="h-logo">${brand}</b><a href="#rooms">Домики</a><a href="#experience">Впечатления</a><a href="#contact">Как добраться</a></header><div class="h-copy enter"><small>Mountain retreat · ${city}</small><h1>Вернуться к себе</h1><p>${copy} Здесь день начинается с тишины, а планы можно оставить в городе.</p></div><aside class="h-book enter"><b>Найти свободный домик</b><div class="h-fields"><span>Заезд<br>Выберите дату</span><span>Выезд<br>Выберите дату</span></div>${A('Проверить даты')}</aside></section><section class="h-intro"><small>Slow living / 2 100 м</small><div><h2>Место, где горы задают ритм</h2><p>Не отель с одинаковыми номерами, а небольшая коллекция частных домиков. У каждого свой вид, терраса и характер. Мы сохранили простоту материалов и добавили ровно столько комфорта, сколько нужно для настоящего отдыха.</p></div></section><section class="h-rooms" id="rooms"><div class="h-room-grid"><article class="h-room">${Iu('https://images.unsplash.com/photo-1449158743715-0a90ebb6d2d8?auto=format&fit=crop&w=1500&q=88','Домик Forest')}<div class="h-room-info"><b>Forest House</b><span>2 гостя · камин · терраса</span></div></article><article class="h-room small">${Iu('https://images.unsplash.com/photo-1505691938895-1758d7feb511?auto=format&fit=crop&w=1200&q=88','Интерьер домика Valley')}<div class="h-room-info"><b>Valley Cabin</b><span>4 гостя · кухня · ванна</span></div></article></div></section><section class="h-experience" id="experience"><figure>${Iu('https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=1500&q=88','Путешествие в горах')}</figure><div class="h-exp-copy"><small>Beyond the room</small><h2>Прожить день, а не заполнить расписание</h2><p>Утренний маршрут с проводником, пикник у воды, баня после тропы и ужин у открытого огня. Выберите настроение — остальное мы соберём вокруг него.</p>${A('Собрать поездку')}</div></section><footer class="h-footer" id="contact"><h2>Горы уже ждут.</h2><div class="h-footer-row"><span>${brand} · ${city}</span><span>Маршрут · Погода · Связаться</span></div></footer></div>`,
        fitness:()=>`<div class="page"><div class="stripe"></div><nav><b>${brand}</b><span>${city} / MOVE</span></nav><section class="copy enter"><h1>Find your <span>power</span></h1><p>${copy}</p>${A('Начать движение')}</section><figure class="photo">${I()}</figure><div class="ticker"><span>${[...items,...items,...items].join(' ✦ ')} ✦ </span></div></div>`,
        education:()=>`<div class="page"><nav><b>${brand}</b><span>${city}</span>${A('Пробный урок')}</nav><section class="bento"><article class="tile main enter"><span class="label">Learning by doing</span><h1>${title}</h1><p>${copy}</p><span class="bubble">Посмотреть программы →</span></article><figure class="tile photo">${I()}</figure><article class="tile stat"><small>Практика</small><b>80%</b><span>занятия через реальные проекты</span></article><article class="tile idea"><small>Направления</small><h2>${items.join(' · ')}</h2></article></section></div>`,
        logistics:()=>`<div class="page"><aside class="enter"><b>${brand}</b><h1>${title}</h1><p>${copy}</p>${A('Рассчитать маршрут')}</aside><section class="map"><i class="node n1"></i><i class="node n2"></i><i class="node n3"></i><article class="shipment"><small>ACTIVE SHIPMENT / ${city}</small><b>ALA → NQZ</b><div class="progress"><i></i></div></article></section></div>`,
        autoservice:()=>`<div class="page"><i class="redline"></i><nav><b>${brand}</b><span>${city} · AUTO LAB</span></nav><section class="hero"><div class="enter"><h1>Drive.<br><span>We care.</span></h1><p>${copy}</p>${A('Записаться')}</div><figure class="car">${I()}</figure></section><div class="service-row">${items.map((x,i)=>`<div class="service"><b>0${i+1}</b><span>${x}</span></div>`).join('')}</div></div>`,
        agro:()=>`<div class="page"><header class="mast"><span>Сезон · 2026</span><b>${brand}</b><span>${city}</span></header><section class="lead enter"><h1>Честный продукт с земли</h1><div class="lead-copy"><p>${copy}</p>${A('Открыть каталог')}</div></section><section class="produce"><article>${I()}</article>${items.map((x,i)=>`<article><small>ПАРТИЯ / 0${i+1}</small><b>${x}</b><p>${features[i]}</p></article>`).join('')}</section></div>`,
        legal:()=>`<div class="page"><aside><b>${brand}</b><div class="index">01 / ПРАКТИКИ<br>02 / КОМАНДА<br>03 / КОНТАКТ</div><small>${city} · 2026</small></aside><main class="enter"><nav><span>RU</span><span>Конфиденциально</span></nav><h1>Сложное <span>становится ясным</span></h1><section class="statement"><p>${copy}</p><div class="matters">${items.map(x=>`<div class="matter">${x}</div>`).join('')}</div></section>${A('Описать задачу')}</main></div>`,
        events:()=>`<div class="page"><nav><b>${brand}</b><span>${city} · EVENT ATELIER</span></nav><h1 class="enter">Make it <span>unforgettable</span></h1><figure class="card c1">${I()}</figure><figure class="card c2">${I()}</figure><figure class="card c3">${I()}</figure><section class="copy"><p>${copy}</p>${A('Запросить дату')}</section></div>`,
        expert:()=>`<div class="page"><section class="copy enter"><nav><b>${brand}</b><span>${city}</span></nav><span class="num">01 — CLARITY / 02 — STRATEGY / 03 — ACTION</span><h1>Ясность <span>для следующего шага</span></h1><p>${copy}</p>${A('Выбрать консультацию')}</section><figure class="portrait">${I()}</figure></div>`,
        pet:()=>`<div class="page"><nav><b>${brand}</b>${A('В каталог')}</nav><section class="hero"><div class="enter"><div class="pills">${items.map(x=>`<span>${x}</span>`).join('')}</div><h1>Good things <span>for pets</span></h1><p>${copy}</p>${A('Подобрать товары')}</div><div class="photo-wrap"><figure class="photo">${I()}</figure><span class="sticker s1">100%<br>CARE</span><span class="sticker s2">WOW!</span></div></section></div>`,
        wellness:()=>`<div class="page"><section class="copy enter"><nav><b>${brand}</b><span>${city}</span></nav><h1>Тише. Глубже. <em>Осознаннее.</em></h1><p>${copy}</p>${A('Узнать о продукте')}</section><figure class="visual"><i class="orbit"></i>${I()}<figcaption class="note">${features[0]}<br>${features[1]}<br>${features[2]}</figcaption></figure></div>`,
        'cosmetics-network':()=>`<div class="page"><nav><b>${brand}</b><span>${city} · PARTNER HOUSE</span></nav><section class="hero"><div class="enter"><h1>Beauty <span>worth sharing</span></h1><p>${copy}</p>${A('Открыть коллекцию')}</div><figure class="product">${I()}<span class="seal">Beauty partner<br>collection</span></figure></section><footer class="partner-strip">${features.map(x=>`<span>${x}</span>`).join('')}</footer></div>`,
